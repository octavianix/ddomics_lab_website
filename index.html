    <script>
      (function () {
        try {
          var t = localStorage.getItem("ddomics-theme") || "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
    <script>
      // Restore the route encoded by public/404.html's redirect (GitHub
      // Pages SPA fallback) before the router mounts.
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("redirect");
        if (redirect) {
          var basePath = "/ddomics_lab_website";
          window.history.replaceState(null, "", basePath + redirect);
        }
      })();
    </script>
